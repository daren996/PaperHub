[project]
name = "paperhub"
version = "0.1.0"
description = "Agent-native literature knowledge manager for Zotero, Obsidian, Codex, Claude Code, and MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daren Chao" }]
dependencies = [
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.2.0",
  "pyyaml>=6.0.0",
  "rich>=13.9.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]
mcp = [
  "mcp>=1.2.0",
]
pdf = [
  "pymupdf>=1.24.0",
]

[project.scripts]
paperhub = "paperhub.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
